[package]
name = "tatou"
version = "0.1.0-alpha.13"
edition = "2024"
rust-version = "1.98"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
tempfile = "3.27.0"
